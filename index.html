<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios Locales</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario" maxlength="10" required>
            <input type="password" id="password" placeholder="Contraseña" maxlength="10" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <p id="loginMessage" class="message"></p>

        <h2>¿No tienes una cuenta? Regístrate</h2>
        <form id="userForm">
            <input type="text" id="nombre" placeholder="Nombre" maxlength="10" required>
            <input type="text" id="usuario" placeholder="Usuario" maxlength="10" required>
            <input type="password" id="passwordUser" placeholder="Contraseña" maxlength="10" required>
            <button type="submit">Registrar</button>
        </form>
        <p id="errorMessage" class="error-message"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
