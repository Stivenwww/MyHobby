<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
</head>
<style>
    /* Estilos generales */
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
}

/* Estilos del título */
h1 {
    background-color: #333;
    color: white;
    padding: 15px;
}

/* Botón de cerrar sesión */
button {
    background-color: #d9534f;
    color: white;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    margin: 10px;
    border-radius: 5px;
}

button:hover {
    background-color: #c9302c;
}

/* Tabla de usuarios */
table {
    width: 80%;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: white;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th {
    background-color: #333;
    color: white;
}

/* Estilos para los botones de la tabla */
.edit-btn, .delete-btn {
    padding: 5px 10px;
    border: none;
    cursor: pointer;
    border-radius: 3px;
}

.edit-btn {
    background-color: #5bc0de;
    color: white;
}

.delete-btn {
    background-color: #d9534f;
    color: white;
}

.edit-btn:hover {
    background-color: #31b0d5;
}

.delete-btn:hover {
    background-color: #c9302c;
}

</style>
<body>

    <h1>Panel de Administración</h1>
    <button onclick="logout()">Cerrar Sesión</button>

    <h2>Usuarios Registrados</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="userTable">
            <!-- Aquí se cargarán los usuarios dinámicamente -->
        </tbody>
    </table>

    <script src="script.js"></script> <!-- Enlace al archivo JavaScript -->
</body>
</html>
