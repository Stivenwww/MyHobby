<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasta Pronto</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #cc5500;
        }

        .basketball {
            position: absolute;
            width: 50px;
            height: 50px;
            background: url('https://images.emojiterra.com/google/noto-emoji/unicode-16.0/color/512px/1f3c0.png') no-repeat center/cover;
            left: 50%;
            transform: translateX(-50%);
            bottom: 50px;
            animation: bounce 1.5s infinite cubic-bezier(0.3, 0.6, 0.5, 1);
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-120px) scaleY(1.1);
            }
        }

        .shadow {
            position: absolute;
            bottom: 45px;
            left: 50%;
            width: 50px;
            height: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            transform: translateX(-50%);
            animation: shadow-scale 1.5s infinite ease-in-out;
        }

        @keyframes shadow-scale {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 0.5;
            }

            50% {
                transform: translateX(-50%) scale(0.5);
                opacity: 0.2;
            }
        }
    </style>
</head>

<body>
    <div class="basketball"></div>
    <div class="shadow"></div>

    <div class="container">
        <h2>Hasta pronto, Usuario</h2>
        <p>Has cerrado sesión correctamente.</p>
        <button id="logoutBtn">Cerrar Sesión</button>
    </div>

    <script>
        document.getElementById("logoutBtn").addEventListener("click", function () {
            sessionStorage.removeItem("loggedIn");
            alert("Sesión cerrada.");
            window.location.href = "index.html"; // Redirige a la página principal
        });
    </script>
</body>

</html>
